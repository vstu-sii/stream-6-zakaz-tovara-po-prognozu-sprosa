name: CI

on:
  push:
    branches: [main, RamaKurama-patch-1]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test — import app
        run: |
          python -c "from src.main import app; print('app imported OK')"

      - name: Build Docker image
        run: docker build -t ai-store-order:ci .
